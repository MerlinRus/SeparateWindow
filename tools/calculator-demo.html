<!doctype html><html lang="ru"><meta charset="utf-8"><title>Tools — demo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f3f6;color:#253246;font:16px/1.5 "Segoe UI",sans-serif}header{height:56px;padding:16px 32px;background:white;border-bottom:1px solid #dbe1e8;font-weight:600}main{display:grid;grid-template-columns:200px 360px 1fr;gap:32px;margin:32px}nav{padding:24px 16px;background:#fff;border:1px solid #dbe1e8;border-radius:8px}nav span{display:block;margin:0 0 20px;color:#59677a}.widget{width:360px;padding:24px;background:white;border:1px solid #dbe1e8;border-radius:10px}.widget h1{font-size:26px;font-weight:500;margin:0 0 20px}.widget label{display:block;color:#59677a;font-size:15px;margin:0 0 16px}.widget input{display:block;width:100%;padding:10px 12px;border:1px solid #cbd3de;border-radius:6px;font:20px "Segoe UI",sans-serif;margin-top:6px}.widget button{width:100%;background:#2357d9;color:white;border:0;border-radius:6px;padding:12px;font:16px "Segoe UI",sans-serif;cursor:pointer}.total{border-top:1px solid #e4e8ee;margin-top:24px;padding-top:16px;color:#59677a}.total output{display:block;font-size:40px;color:#253246;font-variant-numeric:tabular-nums}.ad{padding:28px;background:#eee5d5;border-radius:8px;height:240px}.ad small{color:#7d7468}.ad h2{font-weight:500;font-size:24px}.ad p{font-size:16px}.links{margin-top:24px;background:white;padding:24px;border-radius:8px}.links p{color:#637185;margin:16px 0}
</style><header data-en="Tools">Инструменты</header><main><nav><span data-en="Calculators">Калькуляторы</span><span data-en="Converters">Конвертеры</span><span data-en="Tables">Таблицы</span><span data-en="Calendar">Календарь</span></nav><section class="widget" id="calculator"><h1 data-en="Calculator">Калькулятор</h1><label><span data-en="Price">Цена</span><input id="price" type="number" value="250"></label><label><span data-en="Quantity">Количество</span><input id="quantity" type="number" value="4"></label><button id="calculate" data-en="Calculate">Рассчитать</button><div class="total"><span data-en="Total">Итого</span><output id="total">1000</output></div></section><aside><div class="ad"><small data-en="Advertisement">Реклама</small><h2 data-en="Learn something new">Новые навыки</h2><p data-en="Explore online courses">Выбрать онлайн-курс</p></div><div class="links"><strong data-en="Other tools">Другие инструменты</strong><p data-en="Unit converter">Перевод единиц</p><p data-en="Date calculator">Разница между датами</p></div></aside></main><script>
const english=new URLSearchParams(location.search).get('lang')==='en';
if(english){document.documentElement.lang='en';for(const node of document.querySelectorAll('[data-en]'))node.textContent=node.dataset.en;}
window.identity=crypto.randomUUID();
document.querySelector('#calculate').addEventListener('click',()=>{document.querySelector('#total').textContent=String(Number(document.querySelector('#price').value)*Number(document.querySelector('#quantity').value))});
</script></html>
